name: Idea de animación
description: Propón una nueva animación de reparto de equipos
title: "[Idea] "
labels: ["idea"]
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre de la animación
      placeholder: "Ej.: Fast & Furious"
    validations:
      required: true
  - type: input
    id: cancion
    attributes:
      label: Canción (y segundo de inicio)
      placeholder: "Ej.: See You Again, desde 1:52"
  - type: input
    id: referencia
    attributes:
      label: Referencia (vídeo, meme, anime…)
  - type: textarea
    id: equipos
    attributes:
      label: ¿Qué pasa cuando aparecen los equipos?
    validations:
      required: true
  - type: textarea
    id: ganador
    attributes:
      label: ¿Qué pasa en la repetición del ganador?
  - type: textarea
    id: easter
    attributes:
      label: Easter egg (opcional)
